<style id="viewer-css">
/* Layout: one full-screen stage (the 360 viewer) with glass controls floating over it. */
:root{
  color-scheme: dark;
  --ink:#0c0e11; --ink-2:#14171c; --ink-3:#1c2027;
  --glass:rgba(15,17,21,.80); --glass-strong:rgba(12,14,18,.94);
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.24);
  --text:#f3efe8; --muted:#aaa59c; --faint:#77736c;
  --accent:#f2a93b; --accent-2:#ffcc7a; --accent-ink:#1d1405;
  --ok:#7fd3a0; --warn:#f2c94c; --bad:#f08a7e;
  --f-display:"Archivo","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-body:"Archivo","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:8px; --r-md:14px; --r-lg:22px;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --top:max(14px, env(safe-area-inset-top, 0px));
  --bot:max(14px, env(safe-area-inset-bottom, 0px));
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font:inherit;color:inherit}
.stage{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;outline:none}
.stage canvas.dragging{cursor:grabbing}
.stage canvas.picking{cursor:crosshair}
.stage .fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s ease}
.stage .fade.on{opacity:1}
.hs-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hs{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;padding:0;cursor:pointer;will-change:transform}
.hs .disk{position:absolute;left:-50px;top:-50px;width:100px;height:100px;transform-origin:50% 50%}
.hs .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%, rgba(12,14,18,.38) 0 50%, rgba(255,255,255,.97) 51.5% 60%, rgba(0,0,0,.22) 61.5%, rgba(0,0,0,0) 70%);
  transition:transform .2s ease, background .2s ease}
.hs .chev{position:absolute;inset:0;display:grid;place-items:center}
.hs .chev svg{width:46%;height:46%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.hs:hover .ring,.hs:focus-visible .ring{transform:scale(1.1);background:radial-gradient(circle at 50% 50%, rgba(242,169,59,.78) 0 50%, rgba(255,255,255,1) 51.5% 60%, rgba(0,0,0,.22) 61.5%, rgba(0,0,0,0) 70%)}
.hs .bill{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:rgba(14,16,20,.72);border:2px solid #fff;display:grid;place-items:center;
  box-shadow:0 4px 18px rgba(0,0,0,.35);transition:transform .2s ease, background .2s ease}
.hs .bill svg{width:22px;height:22px}
.hs:hover .bill,.hs:focus-visible .bill{transform:scale(1.1);background:var(--accent);color:var(--accent-ink)}
.hs .label{position:absolute;left:0;top:0;transform:translate(-50%, 0);white-space:nowrap;font-size:12.5px;font-weight:600;letter-spacing:.01em;
  padding:5px 10px;border-radius:999px;background:rgba(10,12,15,.82);border:1px solid rgba(255,255,255,.18);
  box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none}
.hs:focus-visible{outline:none}
.hs:focus-visible .label{border-color:var(--accent)}
.hs.loading .ring{animation:hspulse 1s ease-in-out infinite}
@keyframes hspulse{50%{transform:scale(1.18);opacity:.7}}
.hs.editing .ring{background:radial-gradient(circle at 50% 50%, rgba(242,169,59,.45) 0 50%, var(--accent) 51.5% 60%, rgba(0,0,0,.22) 61.5%, rgba(0,0,0,0) 70%)}
.boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#cfc9bf;font-size:13px;background:#0c0e11;transition:opacity .5s ease;z-index:3}
.boot.gone{opacity:0;pointer-events:none}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.hs .ring,.hs .bill{transition:none}.hs.loading .ring{animation:none}}
</style>
<style id="app-css">
/* ---------- app chrome ----------
   No backdrop blur anywhere: blurring a live 360 view has to be redone on every frame and was the
   biggest cost while dragging. Slightly more solid panels give the same calm look for free. */
.glass{background:var(--glass);border:1px solid var(--line)}
/* panels sized against the screen include their padding, so they never run past a phone's edge */
.welcome,.plan,.sheet,.toast,.roompill,.banner,.titlecard,.builder{box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.06);
  font-weight:600;font-size:14px;cursor:pointer;transition:background .15s ease, border-color .15s ease, transform .15s ease;white-space:nowrap;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.12)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.ibtn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:18px;height:18px;flex:none}
.btn.small svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.small{min-height:34px;padding:0 13px;font-size:13px}
.btn.danger{border-color:rgba(240,138,126,.45);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass);cursor:pointer;transition:background .15s ease}
.ibtn:hover{background:rgba(40,44,52,.85)}
.ibtn svg{width:19px;height:19px}
.ibtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mono{font-family:var(--f-mono);font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums}

/* top bar in tour mode */
.topbar{position:fixed;left:var(--gut);right:var(--gut-r);top:var(--top);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none;z-index:5}
.topbar > *{pointer-events:auto}
.titlecard{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:999px;min-width:0;flex:0 1 auto;max-width:min(560px, 100%)}
.titlecard .ibtn{flex:none;background:rgba(255,255,255,.06)}
.titlecard .tt{min-width:0}
.titlecard .t1{font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:700;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlecard .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;flex:none;justify-content:flex-end}

/* room strip */
.rooms{position:fixed;left:0;right:0;bottom:var(--bot);display:flex;justify-content:center;pointer-events:none;z-index:5;padding-left:var(--gut);padding-right:var(--gut-r)}
.rooms .track{pointer-events:auto;display:flex;gap:8px;padding:8px;border-radius:20px;overflow-x:auto;max-width:100%;scrollbar-width:none;scroll-snap-type:x proximity}
.rooms .track::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:stretch;gap:6px;width:116px;padding:5px;border-radius:13px;border:1px solid transparent;background:rgba(255,255,255,.04);cursor:pointer;scroll-snap-align:center;text-align:left}
.chip img{width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:9px;display:block;background:var(--ink-3)}
.chip span{font-size:12.5px;font-weight:600;padding:0 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{background:rgba(255,255,255,.09)}
.chip[aria-current="true"]{border-color:var(--accent);background:rgba(242,169,59,.12)}

/* room info pill */
.roompill{position:fixed;left:50%;top:calc(var(--top) + 64px);transform:translateX(-50%);padding:6px 14px;border-radius:999px;font-size:13px;display:flex;gap:10px;align-items:center;z-index:4;white-space:nowrap;max-width:calc(100% - 32px)}
.roompill b{font-weight:700}
.roompill .mono{color:var(--muted);font-size:12px}

/* hint */
.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 20px;border-radius:16px;display:flex;align-items:center;gap:14px;z-index:4;pointer-events:none;transition:opacity .6s ease}
.hint.gone{opacity:0}
.hint svg{width:34px;height:34px;flex:none}
.hint .h1{font-weight:700}
.hint .h2{color:var(--muted);font-size:13px}

/* floor plan */
.plan{position:fixed;left:var(--gut);bottom:calc(var(--bot) + 106px);width:min(360px, calc(100% - 32px));border-radius:var(--r-md);padding:10px;z-index:6}
.plan header{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px}
.plan header b{font-family:var(--f-display);font-variation-settings:"wdth" 108;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.plan .pwrap{position:relative;border-radius:10px;overflow:hidden;background:#e9e5de}
.plan .pwrap img{display:block;width:100%;height:auto}
.plan .dot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid #fff;background:#3a3f48;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer;padding:0}
.plan .dot[aria-current="true"]{background:var(--accent)}
.plan .cone{position:absolute;width:0;height:0;pointer-events:none}
.plan .cone svg{position:absolute;left:-60px;top:-60px;width:120px;height:120px;overflow:visible}
.plan .plabel{position:absolute;transform:translate(-50%, 13px);font-size:10.5px;font-weight:700;color:#23272e;white-space:nowrap;pointer-events:none;background:rgba(255,255,255,.82);padding:1px 6px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* zoom */
.zoom{position:fixed;right:var(--gut-r);bottom:calc(var(--bot) + 106px);display:flex;flex-direction:column;gap:8px;z-index:5}

/* welcome card (home) */
.welcome{position:fixed;left:var(--gut);bottom:calc(var(--bot) + 8px);width:min(514px, calc(100% - 32px));border-radius:var(--r-lg);padding:22px 22px 20px;z-index:8;background:var(--glass-strong)}
.welcome .eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.welcome .eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(242,169,59,.18);display:inline-block}
.welcome h1{font-family:var(--f-display);font-variation-settings:"wdth" 118;font-weight:800;font-size:clamp(28px, 5vw, 38px);line-height:1.02;margin:10px 0 8px;letter-spacing:-.01em;text-wrap:balance}
.welcome p{margin:0 0 16px;color:#d8d3ca;font-size:15px;max-width:42ch;text-wrap:pretty}
.welcome .row{display:flex;gap:10px;flex-wrap:wrap}
.welcome .meta{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.welcome .meta span{display:flex;align-items:center;gap:6px}
.welcome .meta svg{width:15px;height:15px;opacity:.8}
.brandmark{position:fixed;right:var(--gut-r);top:var(--top);display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;z-index:8}
.brandmark b{font-family:var(--f-display);font-variation-settings:"wdth" 120;font-weight:800;letter-spacing:.02em}
.logo{width:26px;height:26px;flex:none}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(5,6,8,.55);z-index:30;display:grid;place-items:center;padding:16px}
.sheet{width:min(768px, 100%);max-height:calc(100% - 32px);overflow:auto;border-radius:var(--r-lg);background:var(--ink-2);border:1px solid var(--line);padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sheet h2{font-family:var(--f-display);font-variation-settings:"wdth" 112;font-size:24px;margin:0 0 6px;text-wrap:balance}
.sheet h3{font-size:15px;margin:18px 0 6px}
.sheet p,.sheet li{color:#d6d1c8}
.sheet .sub{color:var(--muted);margin:0 0 14px}
.sheet .grid3{display:grid;grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));gap:12px;margin-top:14px}
.sheet .card{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;background:rgba(255,255,255,.03);min-width:0}
.sheet .card .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sheet .card b{display:block;margin:6px 0 4px}
.sheet .card p{margin:0;font-size:13px}
.sheet .tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);margin-top:8px}
.sheet .tag.good{border-color:rgba(127,211,160,.5);color:var(--ok)}
.sheet .tag.mid{border-color:rgba(242,201,76,.5);color:var(--warn)}
.sheet .tag.no{border-color:rgba(240,138,126,.5);color:var(--bad)}
.sheet .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

/* ---------- builder ---------- */
.builder{position:fixed;left:0;top:0;bottom:0;width:380px;max-width:100%;z-index:10;display:flex;flex-direction:column;background:var(--glass-strong);border-right:1px solid var(--line);
  padding-top:var(--top);padding-bottom:var(--bot)}
.builder .bhead{display:flex;align-items:center;gap:10px;padding:2px 16px 12px 12px;border-bottom:1px solid var(--line)}
.builder .bhead .tt{flex:1;min-width:0}
.builder .bhead input{width:100%;background:transparent;border:0;color:var(--text);font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:700;font-size:16px;padding:4px 6px;border-radius:6px}
.builder .bhead input:hover{background:rgba(255,255,255,.05)}
.builder .bhead .t2{font-size:12px;color:var(--muted);padding:0 6px}
.builder .bbody{flex:1;overflow:auto;padding:14px 14px 18px}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r-md);padding:18px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .15s, background .15s;cursor:pointer}
.drop.over{border-color:var(--accent);background:rgba(242,169,59,.08)}
.drop.compact{flex-direction:row;justify-content:space-between;padding:10px 12px;text-align:left}
.drop.compact svg,.drop.compact small{display:none}
.drop.compact b{font-size:13.5px}
.drop.compact .row{margin:0}
.drop svg{width:30px;height:30px;color:var(--accent)}
.drop b{font-size:14.5px}
.drop small{color:var(--muted);font-size:12.5px;max-width:36ch}
.drop .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.steps{display:flex;gap:6px;margin:14px 0 10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;border:1px solid var(--line)}
.steps span.on{border-color:var(--accent);color:var(--text)}
.steps span i{font-style:normal;font-family:var(--f-mono);color:var(--accent)}
.rlist{display:flex;flex-direction:column;gap:8px}
.rcard{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer}
.rcard[aria-current="true"]{border-color:var(--accent);background:rgba(242,169,59,.09)}
.rcard img{width:96px;aspect-ratio:2/1;object-fit:cover;border-radius:8px;display:block;background:var(--ink-3)}
.rcard .rmeta{min-width:0}
.rcard input{width:100%;background:transparent;border:1px solid transparent;color:var(--text);font-weight:600;font-size:14px;padding:3px 6px;border-radius:6px;min-width:0}
.rcard input:hover,.rcard input:focus{border-color:var(--line-2);background:rgba(0,0,0,.2)}
.rcard .badges{display:flex;gap:6px;flex-wrap:wrap;padding:2px 6px 0}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.badge.ok{border-color:rgba(127,211,160,.5);color:var(--ok)}
.badge.mid{border-color:rgba(242,201,76,.55);color:var(--warn)}
.badge.start{border-color:var(--accent);color:var(--accent)}
.rcard .acts{display:flex;flex-direction:column;gap:4px}
.mini{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer}
.mini:hover{background:rgba(255,255,255,.08)}
.mini svg{width:15px;height:15px}
.rcard.proc{opacity:.75;cursor:progress}
.rcard .prog{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 6px 2px}
.rcard .prog i{display:block;height:100%;width:40%;background:var(--accent);animation:indet 1.1s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.note{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid rgba(242,201,76,.35);background:rgba(242,201,76,.07);font-size:12.5px;color:#e9dfc0}
.note.err{border-color:rgba(240,138,126,.45);background:rgba(240,138,126,.08);color:#f3d0ca}
.note b{color:var(--text)}
.note.ok{border-color:rgba(127,211,160,.4);background:rgba(127,211,160,.07);color:#cfe9d9}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;font-size:inherit}
.namechips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 6px}
.nchip{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);cursor:pointer}
.nchip:hover{background:rgba(255,255,255,.1)}
.nchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.lens{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:999px;font-size:12.5px}
.lens span{color:var(--muted);margin-right:2px}
.lens button{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px}
.lens button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.bfoot{border-top:1px solid var(--line);padding:12px 14px 2px;display:flex;gap:8px;flex-wrap:wrap}
.bfoot .btn{flex:1}
.draftline{font-size:11.5px;color:var(--faint);padding:6px 14px 0}

.edittools{position:fixed;left:calc(380px + 16px);right:var(--gut-r);top:var(--top);display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:9;pointer-events:none}
.edittools > *{pointer-events:auto}
.edittools .roomname{padding:8px 14px;border-radius:999px;font-weight:700;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{position:fixed;left:calc(380px + (100% - 380px)/2);top:calc(var(--top) + 58px);transform:translateX(-50%);padding:8px 8px 8px 16px;border-radius:14px;z-index:9;display:flex;gap:12px;align-items:center;max-width:calc(100% - 412px);font-size:13.5px}
.banner b{color:var(--accent)}
.pop{position:fixed;z-index:20;min-width:220px;max-width:280px;border-radius:14px;padding:10px;background:rgba(20,23,28,.97);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.pop .ph{font-size:12px;color:var(--muted);padding:2px 6px 8px}
.pop .opt{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:10px;border:0;background:transparent;cursor:pointer;text-align:left}
.pop .opt:hover,.pop .opt:focus-visible{background:rgba(255,255,255,.08);outline:none}
.pop .opt img{width:52px;aspect-ratio:2/1;object-fit:cover;border-radius:6px}
.pop label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#d6d1c8;padding:8px 6px 2px}
.pop .sep{height:1px;background:var(--line);margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(var(--bot) + 120px);transform:translateX(-50%);padding:10px 16px;border-radius:12px;z-index:40;font-size:13.5px;max-width:calc(100% - 32px);text-align:center}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:fixed;left:380px;right:0;top:0;bottom:0;text-align:center;padding:24px;color:var(--muted);z-index:2;pointer-events:none}
.empty b{color:var(--text);font-size:17px;font-family:var(--f-display);font-variation-settings:"wdth" 110}
.empty svg{width:64px;height:64px;color:var(--accent);opacity:.9}
.slider{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;font-size:12.5px;min-width:240px}
.slider input{width:100%;accent-color:var(--accent)}
.slider .lab{display:flex;justify-content:space-between;color:var(--muted)}

.building .stage{left:380px}
.building .empty{left:380px}
@media (max-width: 760px){
  .building .stage{left:0;bottom:min(52%, 460px)}
  .builder{top:auto;width:100%;height:min(52%, 460px);border-right:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding-top:6px}
  .edittools{left:var(--gut);top:var(--top)}
  .banner{left:50%;max-width:calc(100% - 32px);top:calc(var(--top) + 104px);bottom:auto;width:max-content}
  .empty,.building .empty{left:0;bottom:min(52%, 460px)}
  .plan{bottom:calc(var(--bot) + 96px)}
  .zoom{display:none}
  .chip{width:92px}
  .welcome{padding:18px 18px 16px;bottom:var(--bot)}
  .welcome p{font-size:14px}
  .roompill{top:calc(var(--top) + 60px)}
  .brandmark{display:none}
  .tools .hide-sm{display:none}
  .titlecard{padding:6px 12px 6px 6px;gap:8px}
  .titlecard .t2{display:none}
  .tools{gap:6px}
  .ibtn{width:40px;height:40px}
}
@media (max-height: 520px){ .rooms .chip img{display:none} .chip{width:auto} .plan{display:none}
  .welcome{padding:14px 16px;max-height:calc(100% - 24px);overflow:auto} .welcome h1{font-size:24px;margin:6px 0} .welcome p{font-size:13px;margin-bottom:10px} .welcome .meta{display:none} .roompill{display:none} }
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} .hint{transition:none} }

uniform samplerCube uA; uniform samplerCube uB;
uniform vec3 uFa, uRa, uUa; uniform vec2 uTa;

const ROOM_NAMES = ['Living Room', 'Dining', 'Kitchen', 'Master Bedroom', 'Bedroom 2', 'Bathroom', 'Balcony', 'Entrance', 'Study', 'Terrace'];
// one-tap names shown under the selected room (no typing needed)
const ROOM_CHIPS = ['Entrance', 'Living Room', 'Drawing Room', 'Dining', 'Kitchen', 'Master Bedroom', 'Bedroom 2', 'Bedroom 3', 'Bathroom', 'Pooja Room', 'Balcony', 'Lobby', 'Staircase', 'Terrace', 'Parking', 'Store'];
const LENS_F35 = { '1x': 26, '0.5x': 13 };
function photoProj(W, H, f35) {
  const longFov = 2 * Math.atan(36 / (2 * f35)), tLong = Math.tan(longFov / 2);
  const tanH = W >= H ? tLong : tLong * W / H, tanV = W >= H ? tLong * H / W : tLong;
  return { type: 2, tanH, tanV };
}
/* Arrows between rooms in the order they are listed, so nobody has to link rooms by hand.
   Hand-placed arrows always win: an automatic arrow is only made when no hand-placed one exists. */
function autoLink(scenes) {
  const ready = scenes.filter(s => s.ready);
  ready.forEach(s => { s.hotspots = s.hotspots.filter(h => !h.auto); });
  const place = (s, dir) => {          // dir: +1 forward (ahead), -1 back (behind / to the left)
    const p = s.proj || {};
    if (p.type === 2) {                // normal photo: both arrows must sit inside the frame
      const hh = Math.atan(p.tanH) / DEG, vv = Math.atan(p.tanV) / DEG;
      return { yaw: round1((s.startYaw || 0) + (dir > 0 ? hh * 0.12 : -hh * 0.55)), pitch: round1(-Math.max(9, vv * 0.4)) };
    }
    const full = s.coverage >= 355;
    if (full) return { yaw: round1(wrap((s.startYaw || 0) + (dir > 0 ? 0 : 180))), pitch: -30 };
    const half = (s.coverage || 180) / 2;
    return { yaw: round1((s.startYaw || 0) + (dir > 0 ? half * 0.1 : -half * 0.6)), pitch: -26 };
  };
  ready.forEach((s, i) => {
    const link = (t, dir) => {
      if (!t || s.noAuto || t.noAuto || s.hotspots.some(h => h.to === t.id)) return;
      const at = place(s, dir);
      s.hotspots.push({ id: `auto-${s.id}-${t.id}`, auto: true, yaw: at.yaw, pitch: at.pitch, to: t.id, arriveYaw: t.startYaw || 0 });
    };
    link(ready[i + 1], 1); link(ready[i - 1], -1);
  });
}
function guessName(fileName, i) {
  const base = fileName.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
  const low = base.toLowerCase();
  for (const n of ROOM_NAMES) if (low.includes(n.toLowerCase().split(' ')[0])) return n;
  if (/^(img|dsc|pxl|vid|photo|pano|r00|insp|insta)/i.test(base) || /^\d/.test(base) || base.length > 28 || !base) return 'Room ' + (i + 1);
  return base.replace(/\b\w/g, c => c.toUpperCase());
}

<script id="capture-script">

  }
  confirmQuit() {
    const p = this.panel(`<h2>Capture band karein?</h2><p>${this.rooms.length ? `${this.rooms.length} room taiyaar hain. Unse tour bana sakte hain.` : 'Abhi tak koi room poora nahi hua.'}</p>
      ${this.rooms.length ? '<button class="btn primary wide" id="qMake">Jitne rooms hue, unka tour banao</button><div style="height:10px"></div>' : ''}
      <button class="btn wide" id="qStay">Capture jaari rakho</button><div style="height:10px"></div><button class="btn wide danger" id="qQuit">Sab chhod ke bahar jao</button>`);
    p.querySelector('#qStay').onclick = () => this.clearPanel();
    p.querySelector('#qQuit').onclick = () => { this.destroy(); if (window.GhoomoApp) window.GhoomoApp.goHome(); };
    const mk = p.querySelector('#qMake'); if (mk) mk.onclick = () => this.finish();
  }
  /* ---- the dots ---- */
  startShots() {
    this.targets = makeTargets().map(t => Object.assign({}, t, { yaw: t.yaw + this.pending.heading, done: false }));
    this.shots = []; this.idx = 0; this.hold = 0; this.mode = 'shoot';
    this.hud(esc(this.pending.name), '', `<button class="btn small" id="cUndo">Pichli photo dobara</button><button class="btn small" id="cSkip" hidden>Yeh hissa chhodo</button>`);
    const bar = this.root.querySelector('.bar');
    bar.insertBefore(h(`<div class="prog"><i></i></div>`), bar.firstChild);
    bar.insertBefore(h(`<div class="tip"></div>`), bar.firstChild);
    this.root.querySelector('#cUndo').onclick = () => this.undo();
    this.root.querySelector('#cSkip').onclick = () => { this.targets[this.idx].done = true; this.targets[this.idx].skipped = true; this.advance(); };
    this.updateHud();
  }
  updateHud() {
    const t = this.targets[this.idx]; if (!t) return;
    const tip = this.root.querySelector('.tip'), pr = this.root.querySelector('.prog i');
    const done = this.targets.filter(x => x.done).length;
    tip.innerHTML = `${RING_TIP[t.ring][0]}<small>${RING_TIP[t.ring][1]} · ${done}/${this.targets.length}</small>`;
    pr.style.width = (100 * done / this.targets.length) + '%';
    this.root.querySelector('.top span').textContent = ['Chaaron taraf', 'Upar', 'Neeche', 'Chhat', 'Farsh'][t.ring];
    const sk = this.root.querySelector('#cSkip'); if (sk) sk.hidden = t.ring < 3;
    const un = this.root.querySelector('#cUndo'); if (un) un.disabled = !this.shots.length;
  }
  undo() {
    if (!this.shots.length) return;
    const last = this.shots.pop(); const t = this.targets[last.ti]; t.done = false; this.idx = last.ti; this.hold = 0; this.updateHud();
  }
  advance() {
    while (this.idx < this.targets.length && this.targets[this.idx].done) this.idx++;
    if (this.idx >= this.targets.length) { this.mode = 'idle'; this.process(); return; }
    this.hold = 0; this.updateHud();
  }
  async shoot() {
    const t = this.targets[this.idx]; this.mode = 'busy';
    const src = this.cam, w = src.w, hh = src.h;
    const c = document.createElement('canvas'); c.width = w; c.height = hh;
    const B = this.B;
    c.getContext('2d').drawImage(src.el, 0, 0, w, hh);
    this.flashEl.classList.add('on'); requestAnimationFrame(() => this.flashEl.classList.remove('on'));
    try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) {}
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
    this.shots.push({ blob, B: { r: B.r.slice(), u: B.u.slice(), f: B.f.slice() }, ti: this.idx });
    t.done = true; this.mode = 'shoot'; this.advance();
  }
  /* ---- per-frame: sensor -> camera direction, guidance, auto shutter ---- */
  loop() {
    const ctx = this.ov.getContext('2d');
    let prevF = null, prevT = performance.now(), speed = 0;
    const step = () => {
      if (!this.running) return;
      requestAnimationFrame(step);
      const now = performance.now(), dt = Math.max(1, now - prevT); prevT = now;
      if (!this.orient) return;
      this.B = basisFromEuler(this.orient.a, this.orient.b, this.orient.g);
      if (this.cam && this.cam.sim) this.cam.render(this.B);
      const f = this.B.f;
      if (prevF) { const ang = Math.acos(clamp(dot(prevF, f), -1, 1)) / DEG; speed = speed * 0.7 + 0.3 * (ang / dt * 1000); }
      prevF = f;
      const tilted = !this.sim && screen.orientation && screen.orientation.angle && screen.orientation.angle % 180 !== 0;
      let tiltEl = this.root.querySelector('.tilt');
      if (tilted && !tiltEl) { tiltEl = h(`<div class="tilt">Phone seedha (portrait) pakadiye</div>`); this.root.appendChild(tiltEl); }
      if (!tilted && tiltEl) tiltEl.remove();
      // overlay
      const cw = this.ov.clientWidth, ch = this.ov.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
      if (this.ov.width !== Math.round(cw * dpr)) { this.ov.width = Math.round(cw * dpr); this.ov.height = Math.round(ch * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cw, ch);
      if (this.mode !== 'shoot' && this.mode !== 'busy') return;
      const vw = this.cam.w || 9, vh = this.cam.h || 16, long = Math.max(vw, vh), tl = Math.tan(ASSUMED_FOV / 2 * DEG);
      const tx = tl * vw / long, ty = tl * vh / long;
      const sc = Math.max(cw / vw, ch / vh), dw = vw * sc, dh = vh * sc;            // object-fit: cover
      const proj = d => { const z = dot(d, f); if (z <= 0.05) return null; return [cw / 2 + dot(d, this.B.r) / (z * tx) * dw / 2, ch / 2 - dot(d, this.B.u) / (z * ty) * dh / 2]; };
      const cx = cw / 2, cy = ch / 2;
      for (const t of this.targets) {
        if (t === this.targets[this.idx]) continue;
        const p = proj(dirOf(t.yaw, t.pitch)); if (!p) continue;
        ctx.beginPath(); ctx.arc(p[0], p[1], t.done ? 7 : 5, 0, Math.PI * 2);
        ctx.fillStyle = t.done ? (t.skipped ? 'rgba(255,255,255,.25)' : 'rgba(127,211,160,.95)') : 'rgba(255,255,255,.55)'; ctx.fill();
      }
      // the circle to aim with
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(cx, cy, 34, 0, Math.PI * 2); ctx.stroke();
      const t = this.targets[this.idx]; if (!t) return;
      const td = dirOf(t.yaw, t.pitch), off = Math.acos(clamp(dot(td, f), -1, 1)) / DEG;
      const p = proj(td);
      const onScreen = p && p[0] > 20 && p[0] < cw - 20 && p[1] > 90 && p[1] < ch - 150;
      if (onScreen) {
        const pulse = 1 + 0.12 * Math.sin(now / 180);
        ctx.beginPath(); ctx.arc(p[0], p[1], 15 * pulse, 0, Math.PI * 2); ctx.fillStyle = '#f2a93b'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
      } else {
        // arrow at the edge pointing the way to turn
        let ax = dot(td, this.B.r), ay = -dot(td, this.B.u); const l = Math.hypot(ax, ay) || 1; ax /= l; ay /= l;
        const R = Math.min(cw, ch) * 0.36, px = cx + ax * R, py = cy + ay * R, ang = Math.atan2(ay, ax);
        ctx.save(); ctx.translate(px, py); ctx.rotate(ang); ctx.fillStyle = '#f2a93b';
        ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(-10, -16); ctx.lineTo(-4, 0); ctx.lineTo(-10, 16); ctx.closePath(); ctx.fill(); ctx.restore();
      }
      // auto shutter: aimed within 3°, held steady
      const aimed = off < 3.2 && speed < 14;
      this.hold = aimed ? this.hold + dt : Math.max(0, this.hold - dt * 2);
      if (this.hold > 0) {
        ctx.lineWidth = 6; ctx.strokeStyle = '#7fd3a0'; ctx.beginPath(); ctx.arc(cx, cy, 34, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, this.hold / 380)); ctx.stroke();
      }
      if (this.mode === 'shoot' && this.hold >= 380) { this.hold = 0; this.shoot(); }
      if (speed > 45 && this.mode === 'shoot') { const tip = this.root.querySelector('.tip small'); if (tip && !tip.dataset.slow) { tip.dataset.slow = '1'; tip.textContent = 'Thoda dheere ghumaiye'; setTimeout(() => { delete tip.dataset.slow; this.updateHud(); }, 1400); } }
    };
    requestAnimationFrame(step);
  }
  /* ---- after the last dot: stitch, enhance, check ---- */
  async process() {
    const top = this.root.querySelector('.top'); if (top) top.remove();
    const bar = this.root.querySelector('.bar'); if (bar) bar.remove();
    const p = this.panel(`<div class="center"><div class="spin"></div><h2>${esc(this.pending.name)} ka 360° bana rahe hain…</h2><p>Photos jod rahe hain aur roshni-rang theek kar rahe hain.</p><div class="prog" style="width:100%"><i></i></div></div>`);
    const bar2 = p.querySelector('.prog i');
    try {
      const res = await stitchRoom(this.shots, { onProgress: v => { bar2.style.width = Math.round(v * 100) + '%'; } });
      const url = URL.createObjectURL(res.blob);
      const pend = this.pending;
      const room = { name: pend.name, parent: pend.parent, heading: pend.heading, blob: res.blob, url, quality: res.quality, fov: res.fov };
      const skipped = this.targets.filter(t => t.skipped).length;
      const low = res.quality < 0.55;
      const q = this.panel(`<div class="k">${esc(room.name)} taiyaar</div><h2>Yeh raha 360° photo</h2>
        <img class="pv" alt="Stitched 360 degree photo of ${esc(room.name)}">
        ${low ? '<div class="warn">Kuch photos theek se nahi jud paayi. Shayad phone ghumate waqt aap jagah se hil gaye, ya room mein bahut kam roshni thi. Ek baar dobara lena behtar rahega.</div>' : ''}
        ${skipped ? `<div class="warn">${skipped === 2 ? 'Chhat aur farsh' : 'Ek hissa'} chhoda gaya. Wahan halka dhundhla bhar diya gaya hai.</div>` : ''}
        <button class="btn primary wide" id="qOk">Achha hai, agla room</button><div style="height:10px"></div>
        <button class="btn wide" id="qFin">Achha hai, tour taiyaar karo</button><div style="height:10px"></div>
        <button class="btn wide" id="qRe">Dobara lo</button>`);
      q.querySelector('img').src = url;
      q.querySelector('#qOk').onclick = () => { this.rooms.push(room); this.roomStart(); };
      q.querySelector('#qFin').onclick = () => { this.rooms.push(room); this.finish(); };
      q.querySelector('#qRe').onclick = () => { URL.revokeObjectURL(url); this.clearPanel(); this.startShots(); };
      window.__capLast = res;
    } catch (e) {
      console.error(e);
      const q = this.panel(`<h2>360° nahi ban paya</h2><p class="warn"></p><button class="btn primary wide" id="qRe">Dobara lo</button>`);
      q.querySelector('.warn').textContent = (e && e.message) || 'Kuch gadbad hui.';
      q.querySelector('#qRe').onclick = () => { this.clearPanel(); this.startShots(); };
    }
  }
  async finish() {
    if (!this.rooms.length) return;
    const rooms = this.rooms.map((r, i) => ({ name: r.name, file: new File([r.blob], r.name.replace(/[^\w\- ]+/g, '') + '.jpg', { type: 'image/jpeg' }), startYaw: r.heading, links: [] }));
    this.rooms.forEach((r, i) => {
      if (r.parent < 0 || !rooms[r.parent]) return;
      // walking from the parent room into this one points along the door direction recorded at its doorway
      rooms[r.parent].links.push({ to: i, yaw: r.heading, arriveYaw: r.heading });
      rooms[i].links.push({ to: r.parent, yaw: r.heading + 180, arriveYaw: r.heading + 180 });
    });
    const title = this.title;
    this.destroy();
    if (window.GhoomoApp) await window.GhoomoApp.importCaptured(title, rooms);
  }
}

window.GhoomoCapture = {
  open(opts = {}) { if (window.__cap) window.__cap.destroy(); const c = new Capture(opts); window.__cap = c; if (opts.simRoom) c.simRoom = opts.simRoom; c.mount(); return c; },
  stitchRoom, basisFromEuler, makeTargets, _sim: openSimCamera, _turn: turn, _dirOf: dirOf,
};
if (window.__wantCapture) window.GhoomoCapture.open(window.__wantCapture);
})();
</script>
</body>
</html>
